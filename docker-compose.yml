version: "2.0"
services:
  gitgud:
    image: ccr.ccs.tencentyun.com/edmondfrank/gitfrank:latest
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Zig version / mirrors default to the values in the Dockerfile; override
        # here (or with `--build-arg`) when building outside China.
        # No default-value interpolation: compose v1 rejects `${VAR:-x}` (and
        # `${VAR-x}`) outright, so an unset APP_REVISION is simply blank.
        APP_REVISION: ${APP_REVISION}
    restart: always
    container_name: gitgud
    env_file: .env
    volumes:
      - /home/ubuntu/data:/data
      - /home/ubuntu/ssh-keys:/app/ssh-keys:ro
    ports:
      - "4000:4000"
      - "1022:1022"
networks:
  default:
    ipam:
      driver: default
      config:
        - subnet: "172.21.0.0/24"
